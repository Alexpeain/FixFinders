<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Crucial for Mobile -->
    <title>{% block title %}Fix Finder Muse{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Noto Sans Myanmar (for Shan/Burmese text) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans Myanmar', sans-serif; /* Force Font */
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 700;
            color: #0d6efd !important; /* Professional Blue */
        }
        .verified-badge {
            color: #198754;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Simple Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'providers:home' %}">
                🔧 Fix Finder
            </a>
            <a href="{% url 'providers:list' %}" class="btn btn-outline-primary btn-sm">Find Pros</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="min-height: 80vh;">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Simple Footer -->
    <footer class="text-center py-4 text-muted mt-5">
        <p class="mb-0">© 2026 Fix Finder Muse & Namkham</p>
        <small>Connecting Locals Safely</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
